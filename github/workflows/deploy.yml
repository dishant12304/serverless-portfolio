name: Deploy to S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::489205146749:role/github-actions-role
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync "./New folder"" end s3://dishant-portfolio2026 --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id E2TDCQKDT72NAQ --paths "/*"